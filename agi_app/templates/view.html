<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Detalhes do Processo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <h2 class="mb-4 text-center">Detalhes do Processo</h2>
    <ul class="list-group">
      <li class="list-group-item"><strong>ID:</strong> {{ processo.id }}</li>
      <li class="list-group-item"><strong>NPU:</strong> {{ processo.npu }}</li>
      <li class="list-group-item"><strong>Cliente:</strong> {{ processo.cliente }}</li>
      <li class="list-group-item"><strong>Estado:</strong> {{ processo.estado }}</li>
    </ul>
    <a href="{{ url_for('index') }}" class="btn btn-primary mt-3">Voltar</a>
  </div>
</body>
</html>
